<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="board-size" content="390x844">
<title>State: clash</title>
<style>
/* ===== Intercut base: the same block opens every board ===== */
@font-face{font-family:"Anton";src:url("../assets/fonts/anton-latin-400.woff2") format("woff2");font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("../assets/fonts/jetbrains-mono-latin-400.woff2") format("woff2");font-display:block}
:root{
  /* colour tokens: tokens.json, theme Night */
  --field:#0A0A0A; --ink:#FFFFFF; --muted:#9C9C9C; --rule:#333333; --safelight:#FF3D14; --on-safelight:#0A0A0A; --signal:#FF3D14;
  /* faces: swap them here, then retune the two numbers below */
  --display:"Anton","HelveticaNeue-CondensedBlack",Impact,sans-serif;
  --mono:"JetBrains Mono",Menlo,monospace;
  --cap:.86;           /* cap height ÷ font size: a display line box is exactly its caps */
  --cap-nudge:.0065em; /* moves the caps down onto the box, so cap top = box top */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--field);color:var(--ink)}
body{font-family:var(--mono);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* display: Anton caps in a box exactly cap-high, so stacked lines butt and the waist sits at 50% */
.display{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:var(--cap);translate:0 var(--cap-nudge);white-space:nowrap}
/* small print: JetBrains Mono caps */
.mono{font-family:var(--mono);font-size:12px;line-height:16px;letter-spacing:.04em;text-transform:uppercase}
/* the splice: one live text node cut at the cap waist by an SVG filter (the filters sit in .defs at the end of body) */
.splice{filter:url(#splice)}
.cut-red{color:var(--safelight)} /* the wordmark under 56px: the cut becomes colour */
.slit{flood-color:var(--safelight)}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* ===== end of base ===== */
/* ===== State: a clash. Two films overlap; the app says by how much and offers the way out ===== */
.screen{width:390px;height:844px;position:relative;overflow:clip}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
.status .time{font-family:var(--display);font-size:20px;line-height:20px}
.film-nav{height:48px;display:flex;border-bottom:1px solid var(--rule)}
.film-nav a{display:flex;align-items:center;padding:0 16px}
.clash-head{padding:24px 16px 24px}
.clash-head .label{color:var(--signal)}
.clash-head .display{font-size:120px;margin-top:20px}
.clash-head .display + .display{font-size:56px;margin-top:8px;color:var(--muted)}
/* the evening drawn to scale: 19:00 to 23:00, 88px an hour, the overlap hatched */
.evening{position:relative;width:352px;height:184px;margin:0 0 0 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.hour{position:absolute;top:8px;left:calc(var(--h) * 88px);color:var(--muted)}
.hour.end{translate:-100% 0}
.slot{position:absolute;left:calc(var(--from) * 88px);width:calc(var(--run) * 88px / 60);height:48px;display:flex;align-items:center;padding:0 8px;overflow:hidden}
.slot .display{font-size:20px}
.slot.kept{top:40px;background:var(--safelight);color:var(--on-safelight)}
.slot.added{top:96px;border:1px solid var(--ink)}
.overlap{position:absolute;top:32px;bottom:28px;left:calc(var(--from) * 88px);width:calc(var(--run) * 88px / 60);background:repeating-linear-gradient(135deg,var(--safelight) 0 2px,transparent 2px 8px)}
.overlap-label{position:absolute;bottom:8px;left:calc(var(--from) * 88px);color:var(--signal)}
.choices{position:absolute;left:0;right:0;bottom:0}
.choice{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid var(--rule)}
.choice .display{font-size:28px}
.choice .mono{color:var(--muted)}
.choice.best{background:var(--safelight);color:var(--on-safelight)}
.choice.best .mono{color:var(--on-safelight)}
</style>
</head>
<body>
<main class="screen">
  <div class="status"><span class="time">18:54</span><span class="mono">5G · 82%</span></div>

  <nav class="film-nav mono" aria-label="Back">
    <a href="programme.html">← Programme</a>
  </nav>

  <header class="clash-head">
    <span class="label mono">Clash in your cut · Sat 06.03</span>
    <h1 class="display">22 min</h1>
    <span class="display">overlap</span>
  </header>

  <figure class="evening" aria-label="Salt Winter 19:30 to 21:22 and Mirror Weather 21:00 to 22:41 overlap by 22 minutes">
    <span class="hour mono" style="--h:0">19:00</span><span class="hour mono" style="--h:1">20</span><span class="hour mono" style="--h:2">21</span><span class="hour mono" style="--h:3">22</span><span class="hour end mono" style="--h:4">23:00</span>
    <span class="overlap" style="--from:2;--run:22"></span>
    <span class="slot kept" style="--from:.5;--run:112"><span class="display">Salt Winter</span></span>
    <span class="slot added" style="--from:2;--run:101"><span class="display">Mirror Weather</span></span>
    <span class="overlap-label mono" style="--from:2">21:00–21:22</span>
  </figure>

  <section class="choices" aria-label="Ways out">
    <a class="choice best" href="home.html"><span class="display">Mon 08.03 · 16:45</span><span class="mono">Mirror Weather, C4</span></a>
    <a class="choice" href="home.html"><span class="display">Keep Salt Winter</span><span class="mono">Drop the other</span></a>
    <a class="choice" href="home.html"><span class="display">Leave at 21:00</span><span class="mono">Miss 22 min</span></a>
    <a class="choice" href="programme.html"><span class="display">Keep both</span><span class="mono">I'll run</span></a>
  </section>
</main>

</body>
</html>
