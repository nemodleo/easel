<!doctype html>
<html lang="en">
<head>
<title>Easel · prototype 5 · ask all three</title>
{{HEAD4}}
<script src="../r4/stage.js" defer></script>
<script src="../r4/page.js" defer></script>
</head>
<body class="p5">
{{TOPBAR}}
<main>
  <section class="hero4" aria-labelledby="h1">
    <div class="r4-lede">
      {{LEDE}}
    </div>
    <div class="right">
      <div class="composer needs-js" id="composer" data-state="ready">
        <p class="c-text"><span class="you">Prompt</span>{{ASK}} <a href="../r4/prompt.txt">Full prompt</a></p>
        <div class="c-foot">
          <ul class="chips" aria-label="Agents">
            <li data-chip="claude"><b>Claude Code</b><span class="st">ready</span></li>
            <li data-chip="codex"><b>Codex</b><span class="st">ready</span></li>
            <li data-chip="cursor"><b>Cursor</b><span class="st">ready</span></li>
          </ul>
          <span class="clockbox" id="clockbox"><span class="clock" id="clock">0:00</span><span>s · {{N}}×</span></span>
          <button class="ask" type="button" id="ask">Ask all three</button>
        </div>
      </div>
      {{STILLS}}
      {{STAGEBOX}}
      <div class="bar">
        <button class="replay needs-js" type="button" id="replay" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>Replay the run</button>
        {{HOWMADE}}
      </div>
    </div>
  </section>
{{WHERE}}
{{START}}
</main>
{{NOTE4}}
</body>
</html>
