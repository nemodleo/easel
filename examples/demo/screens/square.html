<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="board-size" content="1080x1080">
<title>Campaign: social square</title>
<style>
/* ===== Intercut base: the same block opens every board ===== */
@font-face{font-family:"Anton";src:url("../assets/fonts/anton-latin-400.woff2") format("woff2");font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("../assets/fonts/jetbrains-mono-latin-400.woff2") format("woff2");font-display:block}
:root{
  /* colour tokens: tokens.json, theme Night */
  --field:#0A0A0A; --ink:#FFFFFF; --muted:#9C9C9C; --rule:#333333; --safelight:#FF3D14; --on-safelight:#0A0A0A; --signal:#FF3D14;
  /* faces: swap them here, then retune the two numbers below */
  --display:"Anton","HelveticaNeue-CondensedBlack",Impact,sans-serif;
  --mono:"JetBrains Mono",Menlo,monospace;
  --cap:.86;           /* cap height ÷ font size: a display line box is exactly its caps */
  --cap-nudge:.0065em; /* moves the caps down onto the box, so cap top = box top */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--field);color:var(--ink)}
body{font-family:var(--mono);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* display: Anton caps in a box exactly cap-high, so stacked lines butt and the waist sits at 50% */
.display{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:var(--cap);translate:0 var(--cap-nudge);white-space:nowrap}
/* small print: JetBrains Mono caps */
.mono{font-family:var(--mono);font-size:12px;line-height:16px;letter-spacing:.04em;text-transform:uppercase}
/* the splice: one live text node cut at the cap waist by an SVG filter (the filters sit in .defs at the end of body) */
.splice{filter:url(#splice)}
.cut-red{color:var(--safelight)} /* the wordmark under 56px: the cut becomes colour */
.slit{flood-color:var(--safelight)}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* ===== end of base ===== */
/* ===== Social square, 1080 × 1080: one film a day, spliced ===== */
.square{width:1080px;height:1080px;position:relative;overflow:clip}
.square .row{position:absolute;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.square .row.top{top:0;border-bottom:1px solid var(--rule)}
.square .row.top .mono:first-child{color:var(--signal)}
.square .row.bottom{bottom:0;border-top:1px solid var(--rule)}
.square .title{position:absolute;left:0;right:0;top:96px}
.square .title .display{font-size:320px;padding-left:20px}
.square .title .display + .display{margin-top:16px}
.wordmark{display:flex}
.wordmark .display{font-size:28px}
</style>
</head>
<body>
<main class="square">
  <div class="row top mono"><span>Tonight · Opening night</span><span>Thu 04.03</span></div>
  <h1 class="title">
    <span class="display">The</span>
    <span class="display">long</span>
    <span class="display splice">green</span>
  </h1>
  <div class="row bottom mono"><span class="wordmark" aria-label="Intercut"><span class="display">Inter</span><span class="display cut-red">Cut</span></span><span>Doors 19:00 · C1 Meridian · 117 min · Dir. Lene Morrow</span></div>
</main>

<svg class="defs" aria-hidden="true" focusable="false">
  <!-- The splice: one text node, cut at the cap waist. Fractions of the filter box; Anton's cap waist sits at 50% of it in every
       engine, so only the slit's two y numbers retune with the face. dx = shift ÷ element width; change dx if the width changes. -->
  <!-- the third line on the 1080px square: shift one 120px module, a Safelight slit edge to edge -->
  <filter id="splice" x="-.2" y="-.05" width="1.6" height="1.1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feOffset in="SourceGraphic" dx="0" x="-.2" y="-.05" width="1.6" height=".5258" result="upper"/>
    <feFlood class="slit" x="0" y=".4758" width="1" height=".0398" result="slit"/>
    <feOffset in="SourceGraphic" dx=".1111" x="-.2" y=".5156" width="1.6" height=".5344" result="lower"/>
    <feMerge><feMergeNode in="upper"/><feMergeNode in="slit"/><feMergeNode in="lower"/></feMerge>
  </filter>
</svg>
</body>
</html>
